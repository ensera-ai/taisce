events {}

http {
    upstream generation_replicas {
        least_conn;
        server generation-0:8000;
        server generation-1:8000;
        server generation-2:8000;
        server generation-3:8000;
        server generation-4:8000;
        server generation-5:8000;
        server generation-6:8000;
        keepalive 128;
    }

    server {
        listen 8000 ssl;
        ssl_certificate /tls/server.crt;
        ssl_certificate_key /tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass https://generation_replicas;
            proxy_http_version 1.1;
            proxy_set_header Host generation;
            proxy_set_header Connection "";
            proxy_ssl_server_name on;
            proxy_ssl_name generation;
            proxy_ssl_trusted_certificate /tls/ca.crt;
            proxy_ssl_verify on;
            proxy_connect_timeout 10s;
            proxy_read_timeout 10m;
            proxy_send_timeout 10m;
        }
    }
}
