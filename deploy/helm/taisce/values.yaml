#
# The chart is highly available by default: three PostgreSQL instances under the
# CloudNativePG operator, two API replicas and two workers. Shrinking it is documented in the
# README and is the operator's deliberate act; the failure this avoids is a single-node default
# believed to be the other thing. No RTO or RPO is claimed anywhere here: this is a topology with a
# failover path, and the number is measured, not promised.

image:
  repository: ghcr.io/ensera-ai/taisce
  tag: ""            # defaults to the chart's appVersion
  pullPolicy: IfNotPresent

# The memory namespace and the first project bootstrap creates.
schema: memory
project: default

postgresql:
  # cnpg: a CloudNativePG Cluster this chart declares (the operator must be installed first;
  # it is the machinery that knows how to promote a replica). external: an existing database,
  # reached through the secret named below, which must carry adminDSN, memoryDSN and registryDSN.
  mode: cnpg
  cnpg:
    instances: 3
    # An image the operator accepts that provides the vector extension; btree_gist and
    # pg_stat_statements are contrib modules of every PostgreSQL build. The operator's
    # "standard" image family bundles pgvector; a deployment that builds its own image sets it here.
    image: ghcr.io/cloudnative-pg/postgresql:18-standard-bookworm
    storage:
      size: 250Gi
      storageClass: ""
    # The shared-memory volume. Empty derives it from the memory limit, at an eighth — which is
    # always twice maintenance_work_mem, the bound a parallel index build needs it to clear.
    # Stated, it is a whole number of Mi or Gi and anything else is refused: the operator compares
    # this size by spelling with the one the API server stored, and a mismatch replaces a replica
    # without end.
    sharedMemory: ""
    # Where backups go. One of the two must be stated, and a release that states neither is refused.
    #
    # Replicas are not a backup. Three instances protect against losing a node, and nothing else:
    # an erasure of the wrong subject, a migration that goes wrong, a dropped schema and an
    # uninstall are each on every instance within a second. So this chart will not render a
    # database whose operator arrived at "no backup" by not choosing.
    backup:
      # The name of an ObjectStore (barmancloud.cnpg.io) in this namespace. Stated, the cluster
      # archives its write-ahead log there continuously and a base backup is taken on the schedule
      # below. The ObjectStore itself — the bucket, its credentials, how long backups are kept —
      # is yours to create: it belongs to whoever owns the storage, and a chart that wrote one
      # would have to hold the bucket's credentials to do it. The Barman Cloud plugin must be
      # installed beside the operator.
      objectStore: ""
      # When a base backup is taken, as the operator reads it: six fields, seconds first. Daily at
      # 02:00 UTC. One is also taken as soon as the schedule exists, because a deployment whose
      # only backup is tomorrow's has none today.
      schedule: "0 0 2 * * *"
      # true states that this deployment has no backup, on purpose. Nothing in it can then be
      # recovered past what the replicas hold, and the install notes say so every time.
      acknowledgedNone: false
    # The size of the database, and the one number the parameters below follow.
    #
    # Large on purpose. A chart that is small by default is one somebody runs in production
    # believing it was the large one, and that is the worse failure. It does mean the default
    # topology needs 6 CPUs and 750Gi of reservable capacity across three instances, which an
    # ordinary cluster carrying other work does not have spare: values-small.yaml is the shape that
    # fits one, and it changes these two blocks and nothing else, because shared_buffers,
    # effective_cache_size, maintenance_work_mem, max_wal_size and the shared-memory volume are
    # derived from the limit rather than written beside it.
    resources:
      requests: {cpu: "2", memory: 8Gi}
      limits: {memory: 32Gi}
    # What is not a fraction of the memory limit. Stating any of the derived four here overrides it.
    parameters:
      # Memory per sort, so it follows how many queries run at once rather than how much memory the
      # server has.
      work_mem: 16MB
      max_connections: "200"
      # How long a connection whose peer has stopped answering is kept.
      #
      # Formation holds a session advisory lock for the whole drain of a scope, which spans a model
      # call per turn, and a session lock is released only when its session ends. So "the holder has
      # gone" is a question only the database answers, and it answers it by noticing the connection
      # is dead. Left at 0 that is the operating system's default — on Linux about two hours and
      # eleven minutes — during which every other worker asking for that scope is refused and the
      # project forms nothing. A process dying releases its lock at once, because the kernel on its
      # node closes the socket; this is for the node going away, which is the failure several
      # replicas exist to survive. The interval and count stay the operating system's: one idle
      # bound is what moves the detection window from hours to minutes. Raise it on a network where
      # a healthy peer can be silent for longer than this.
      tcp_keepalives_idle: "60"
      wal_compression: "on"
      track_io_timing: "on"
  external:
    existingSecret: ""

# Runtime role passwords. Left empty, the chart generates them once and keeps them across
# upgrades; an existing secret must carry dataPassword and controlPassword.
credentials:
  existingSecret: ""

# The key an erasure's trace is digested with (docs/architecture/governance.md, "After a restore").
# Left empty, the chart generates one once and keeps it across upgrades; an existing secret must
# carry it under `key`, at least 32 characters. Keep a copy outside the cluster: without it, the
# erasures recorded so far cannot be applied again after a restore.
erasureRecord:
  existingSecret: ""

inference:
  endpoint: ""            # OpenAI-compatible base URL; required for formation
  extractorModel: ""
  allowlist: ""           # hosts permitted to receive somebody's words; empty permits nothing
  # The most a generation model may write back for one call, in tokens. Empty states none and the
  # provider's own limit applies. There is no default because the right number depends on the model:
  # one that reasons before it answers spends this on its reasoning, and a ceiling that suits one
  # model returns nothing at all from another. Choose it from taisce_model_completion_tokens_total
  # and taisce_model_replies_cut_total on the scrape. A reply that reaches it is refused whole.
  maxOutputTokens: ""
  apiKeySecret: ""        # a secret with key apiKey; empty sends no key
  embedding:
    endpoint: ""
    model: ""
    revision: ""
    apiKeySecret: ""

api:
  replicas: 2
  requireFormation: true
  bundleCharacters: ""
  # What one API replica may open against the database, and so what it will serve at once.
  #
  # Admission bounds concurrent work at one less than the memory pool, half of that for any one
  # project and half again for any one credential. At 12 that is eleven requests at once per
  # replica, five per project, two per credential, and two concurrent authentications from the
  # registry pool. Those are the numbers this deployment states; left unset they would be whatever
  # the node's CPU count happens to be, which is a load-shedding bound nobody chose.
  #
  # Raising these raises what one replica serves and what the database must have slots for. Work it
  # out before scaling replicas: the demand is api.replicas × (memoryPool + registryPool) +
  # worker.replicas × worker.memoryPool + manage.adminPool, and it has to fit inside
  # postgresql.cnpg.parameters.max_connections with headroom for operators and migrations. At these
  # defaults it is 38 of 200. A process whose own pool does not fit refuses to start and says so.
  memoryPool: 12
  registryPool: 2
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {memory: 1Gi}
  podDisruptionBudget:
    minAvailable: 1

worker:
  replicas: 2
  turnBudget: 5m
  # A worker forms one turn at a time and resolves no credentials, so it needs a fraction of what
  # the API does and is given no registry connection at all.
  memoryPool: 4
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {memory: 1Gi}

# The management surface: in-cluster only unless its ingress is enabled; the portal
# is off unless switched on.
manage:
  enabled: true
  portal: "off"
  # The ops centre serves from the administrative connection for the life of the pod, so it carries a
  # stated ceiling like the API. Three is the floor admission accepts; the surface answers one reader
  # at a time and has no concurrency to size for.
  adminPool: 3
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 512Mi}

# Publishing either surface. Both are off; each is an Ingress, or an HTTPRoute on a cluster whose
# ingress is Gateway API.
#
# The console's hostname routes /portal and its bare root, which redirects into the console — and
# never the management API on the same port. Give the console a hostname of its own: on one it
# shares with the memory API the root stays the API's, and the console is reached at /portal.
#
# For an HTTPRoute the chart renders what attaches and nothing it attaches to. The Gateway and its
# listener are the gateway owner's:
#   parentRefs         the listener(s) the route attaches to; required, for example
#                        [{name: eg, namespace: envoy-gateway-system, sectionName: https}]
#   certificateSecret  a secret in THIS namespace that the listener presents. Naming it renders a
#                        ReferenceGrant letting the gateway's namespace read that one secret and no
#                        other. Leave it empty when the certificate lives beside the gateway.
# className and tls are an Ingress's and are refused on an HTTPRoute rather than ignored.
ingress:
  api:
    enabled: false
    kind: Ingress
    className: ""
    host: ""
    tls: []
    annotations: {}
    parentRefs: []
    certificateSecret: ""
  portal:
    enabled: false
    kind: Ingress
    className: ""
    host: ""
    tls: []
    annotations: {}
    parentRefs: []
    certificateSecret: ""

# Who may open a connection to this release's pods. On by default: every pod of the release refuses
# what is not named here, and the database admits this release, its own instances and its operator.
#
# A cluster whose network plugin enforces no NetworkPolicy accepts these objects and admits everybody;
# the chart cannot tell. Egress is not restricted — templates/networkpolicy.yaml says why.
networkPolicy:
  enabled: true
  api:
    # Who may reach the memory API on 8080, as NetworkPolicy peers. The default is the pods of this
    # release's namespace. An ingress controller or a gateway in a namespace of its own is a
    # stranger until it is named:
    #   - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}
    # An empty list admits nobody.
    from:
      - podSelector: {}
  manage:
    # Who may reach the management surface on 8081. Nobody, until somebody is named: it holds the
    # administrative connection, and an operator reaches it with `kubectl exec` or
    # `kubectl port-forward`, which go through the cluster's API and are not subject to this.
    from: []
  database:
    # The namespace the CloudNativePG operator runs in. It reads each instance's status port, and a
    # database it cannot reach is one nobody is failing over.
    operatorNamespace: cnpg-system

serviceAccount:
  create: true
  name: ""
