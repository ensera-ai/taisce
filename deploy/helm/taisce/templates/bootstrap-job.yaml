#
# Bootstrap: establishes the two database planes, provisions the schema and the first project. It
# mints no credential. It is the one place the administrative connection and the role passwords
# meet. It is an ordinary resource named by the release revision
# rather than a Helm hook: a post-install hook waits for the API to be ready, and the API is not
# ready until bootstrap has run. The serving pods restart until it completes, which on a fresh
# cluster is the database's start-up time.
#
# Naming it by revision means the previous revision's Job leaves the release's manifest set on
# upgrade, so Helm deletes it rather than letting Jobs accumulate.
#
# It is told to mint nothing, and the reason is where its output goes. A Job's standard output is a
# container log, and on a cluster that ships logs it is copied to the log store as it is written and
# kept under that store's retention and access rules — neither of which this release chose. Printing
# the first operator token there put the credential that can mint any other within reach of
# everybody who can query logs, for as long as logs are kept, and deleting the Job afterwards removed
# nothing from the store. A token in a kept Secret would at least be under this namespace's own
# access rules; a token in the log store is under somebody else's.
#
# So the first credentials are minted by the operator, through `exec` into the management surface,
# whose output is streamed to their terminal and is not part of any container's log. NOTES.txt
# prints the commands. What this does not cover: a release with the management surface disabled has
# no workload holding the administrative connection, so there is nowhere to exec into until it is
# enabled; and nothing here can stop an operator pasting the token somewhere that is logged.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "taisce.name" . }}-bootstrap-{{ .Release.Revision }}
  labels: {{- include "taisce.labels" . | nindent 4 }}
    app.kubernetes.io/component: bootstrap
spec:
  backoffLimit: 20
  template:
    metadata:
      labels: {{- include "taisce.labels" . | nindent 8 }}
        app.kubernetes.io/component: bootstrap
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "taisce.serviceAccount" . }}
      {{- include "taisce.dbCAVolumes" . | nindent 6 }}
      securityContext: {{- include "taisce.securityContext" . | nindent 8 }}
      containers:
        - name: bootstrap
          image: {{ include "taisce.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["bootstrap", "-project", {{ .Values.project | quote }}, "-mint-credentials=false"]
          securityContext: {{- include "taisce.containerSecurityContext" . | nindent 12 }}
          {{- include "taisce.dbCAMounts" . | nindent 10 }}
          env:
            - name: TAISCE_SCHEMA
              value: {{ .Values.schema | quote }}
            {{/* Three: the floor the admission gate accepts. The Job runs its statements in order
                 and exits, so nothing here benefits from more, and a Job that outlived its pool
                 would be a bootstrap that failed for a reason unrelated to bootstrapping. */}}
            {{- include "taisce.adminEnv" (dict "root" . "pool" 3) | nindent 12 }}
            {{- if ne .Values.postgresql.mode "external" }}
            - name: TAISCE_DATA_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "taisce.credentialsSecret" . | quote }}, key: dataPassword}}
            - name: TAISCE_CONTROL_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "taisce.credentialsSecret" . | quote }}, key: controlPassword}}
            {{- else }}
            - name: TAISCE_DATA_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.postgresql.external.existingSecret | quote }}, key: dataPassword}}
            - name: TAISCE_CONTROL_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.postgresql.external.existingSecret | quote }}, key: controlPassword}}
            {{- end }}
