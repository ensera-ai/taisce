#
# The two runtime role passwords. Generated once and kept: a password regenerated on every upgrade
# would rotate the roles under running pods. No default value exists, so nothing works because it
# was left unset (rule 8).
{{- if and (not .Values.credentials.existingSecret) (ne .Values.postgresql.mode "external") }}
{{- $name := include "taisce.credentialsSecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "taisce.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $existing }}
  dataPassword: {{ index $existing.data "dataPassword" }}
  controlPassword: {{ index $existing.data "controlPassword" }}
  {{- else }}
  dataPassword: {{ randAlphaNum 40 | b64enc }}
  controlPassword: {{ randAlphaNum 40 | b64enc }}
  {{- end }}
{{- end }}
