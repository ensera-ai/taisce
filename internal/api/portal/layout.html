{{define "layout"}}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Taisce · {{.Title}}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font:15px/1.5 system-ui,sans-serif;margin:0;color:#1b1b1b;background:#fafaf8}
header{display:flex;justify-content:space-between;align-items:center;padding:.8rem 1.5rem;border-bottom:1px solid #ddd;background:#fff}
header a{color:inherit;text-decoration:none;margin-right:1rem}
main{max-width:64rem;margin:0 auto;padding:1.5rem}
table{border-collapse:collapse;width:100%;margin:.5rem 0 1.5rem}
th,td{text-align:left;padding:.35rem .6rem;border-bottom:1px solid #e5e5e5;vertical-align:top}
th{font-weight:600;color:#555}
code{background:#f0f0ec;padding:.05rem .3rem;border-radius:3px}
.note{color:#666;font-size:.9rem}
form.inline{display:inline}
button{font:inherit;padding:.3rem .7rem}
</style></head>
<body><header><nav><a href="/portal/">Instance</a><a href="/portal/ledger">Ledger</a></nav>
{{if .Operator}}<form class="inline" method="post" action="/portal/logout"><span class="note">operator {{.Operator}}</span> <button>Sign out</button></form>{{end}}
</header><main>{{template "body" .}}</main></body></html>{{end}}
