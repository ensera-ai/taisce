#
# A release is a tag on the public repository, and this workflow is the only thing that makes one
#. It runs the complete gate the build runs on every push, then builds the image, the chart
# and the binaries, signs them with the workflow's own identity (Sigstore keyless: no signing key
# exists to steal) and attaches SLSA build provenance — Build Level 2, see D6 — so a package that did not come from here is
# distinguishable from one that did. Nothing here is a claim about a maintainer whose account and
# repository are both compromised; SECURITY.md says so.
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

# Every action is referenced by commit SHA, with the tag it was taken from beside it. A tag can be moved
# by whoever controls the action's repository, and a moved tag would run their code in the job that
# holds this release's signing identity and registry token (#31).
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      # The tag and VERSION have to agree before anything is built. VERSION holds the published
      # minor line, and `scripts/version.sh current` labels every working-tree build from it — so a
      # tag that does not match it releases vX.Y.0 while every build in between calls itself
      # something else. That is #152: VERSION sat at 0.3 for two published lines and nothing noticed,
      # because nothing compared them. This is the check that would have.
      - name: The tag matches the version line
        run: |
          set -euo pipefail
          line="$(tr -d '[:space:]' < VERSION)"
          tag="${GITHUB_REF_NAME#v}"
          # Any patch on the line VERSION names. Not only .0: a release that fails this gate cannot
          # reuse its tag — the `release tags are immutable` ruleset forbids deletion and update on
          # refs/tags/v*, and Actions reads this workflow from the tag's own commit, so re-running
          # the failed tag would re-run the workflow that failed. The retry can only be a patch, and
          # a check demanding .0 made a recoverable failure into a line nobody could cut (#194).
          case "$tag" in
            "${line}."[0-9]|"${line}."[0-9][0-9]) ;;
            *)
              echo "tag $GITHUB_REF_NAME is not on the line VERSION names (${line}): expected v${line}.<patch>" >&2
              echo "either the tag is wrong, or VERSION was not bumped in the release commit" >&2
              exit 1
              ;;
          esac
          echo "tag $GITHUB_REF_NAME is on VERSION's line ${line}"
      # The same pinned helm the build installs, for the same reason and with the same digest. Without
      # it this job rendered the chart with whatever helm the runner image ships, and two tests that
      # assert the content of NOTES.txt disagreed with it — at tag time, on a commit whose own run of
      # this suite had just passed on main. That is #192. The job claimed above to run the complete
      # gate the build runs, and did not.
      #
      # A release is the worst place to discover an environmental difference: a tag must not move, so
      # a gate that fails for a reason the commit did not cause forces a choice between deleting a tag
      # and shipping a version nobody can account for.
      - name: Helm
        env:
          HELM_VERSION: v4.3.0
          HELM_SHA256: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  /tmp/helm.tgz" | sha256sum -c -
          tar -xzf /tmp/helm.tgz -C /tmp linux-amd64/helm
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version --short
      - run: make db-up
      - run: make test COVER_PROFILE=coverage.out
      - run: go vet ./...
      - run: make vuln
      - if: always()
        run: make db-down

  publish:
    needs: gate
    # Publishing waits for the owner's approval. The release environment admits only v*.*.* tags and
    # requires a reviewer, so a pushed tag builds and tests in the gate job but nothing reaches a
    # registry until somebody approves this job. No secret lives in the environment: the job signs with
    # its own OIDC identity and pushes with the run's token, so the gate is who may publish, not what
    # the job can read (#31).
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/taisce
      SUBSTRATE: ghcr.io/${{ github.repository_owner }}/taisce-postgres
      CHART: oci://ghcr.io/${{ github.repository_owner }}/charts
      # Both images carry both architectures. The binaries in this job already build linux/arm64, and
      # an image that did not would hand every Apple Silicon and Graviton operator an emulated
      # container — slower than the build a published image exists to replace.
      PLATFORMS: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      # The runner is amd64. Building arm64 on it means emulating arm64, which is what this provides;
      # it costs minutes at release time and saves them on every pull.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The version the binary reports is the tag, and nothing else about the build varies with the
      # machine: -trimpath drops paths, -buildvcs=false drops the checkout's own stamp, so the same
      # tag builds the same bytes anywhere the same toolchain runs.
      - name: Binaries
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -buildvcs=false \
              -ldflags="-s -w -X main.version=${tag}" -o "dist/taisce-${tag}-${os}-${arch}" ./cmd/taisce
          done
          (cd dist && sha256sum * > "taisce-${tag}-checksums.txt")
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*

      # The chart's own version, which Helm requires to be plain SemVer, so the tag's leading v is
      # dropped here and nowhere else. It names the chart package and nothing the chart installs:
      # the image and the chart's appVersion both carry the release tag exactly as written (#21, D5).
      - name: Version
        id: version
        run: echo "semver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # ── The two images a quickstart pulls ────────────────────────────────────────────────────
      #
      # The service and the substrate are published together and tagged together, so `compose.yaml`
      # needs one version and cannot name a pair that was never built as a pair. The substrate
      # changes far less often than the service and is rebuilt anyway: the layers are cached, and a
      # tag that exists for every release is worth more than the minutes saved by skipping one.
      #
      # `latest` moves and the version tag does not. The quickstart pins the version deliberately —
      # a getting-started guide that silently follows `latest` breaks under people who changed
      # nothing — and `latest` is here for discovery and for anyone who asked for the moving one.
      - name: Image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          provenance: true
          sbom: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
      - name: Sign the image
        run: cosign sign --yes "${IMAGE}@${{ steps.image.outputs.digest }}"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Substrate image
        id: substrate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: deploy/postgres
          platforms: ${{ env.PLATFORMS }}
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.SUBSTRATE }}:${{ github.ref_name }}
            ${{ env.SUBSTRATE }}:latest
      - name: Sign the substrate image
        run: cosign sign --yes "${SUBSTRATE}@${{ steps.substrate.outputs.digest }}"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.SUBSTRATE }}
          subject-digest: ${{ steps.substrate.outputs.digest }}
          push-to-registry: true

      - name: Chart
        id: chart
        env:
          SEMVER: ${{ steps.version.outputs.semver }}
          RELEASE_TAG: ${{ github.ref_name }}
          # Every ref the Image step pushed, as build-push-action reports them.
          PUSHED: ${{ fromJSON(steps.image.outputs.metadata)['image.name'] }}
        run: |
          set -euo pipefail
          # appVersion is the image tag the chart defaults to, so it is the release tag, v and all.
          helm package deploy/helm/taisce --version "$SEMVER" --app-version "$RELEASE_TAG" -d dist
          # Before anything is pushed: the chart must ask for an image this run pushed. A chart that
          # names a missing tag lints clean and fails on every install.
          scripts/chart-image-check.sh "dist/taisce-${SEMVER}.tgz" "$IMAGE" "$PUSHED"
          helm registry login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          helm push "dist/taisce-${SEMVER}.tgz" "$CHART" 2>&1 | tee dist/chart-push.log
          digest="$(grep -o 'sha256:[0-9a-f]*' dist/chart-push.log | head -1)"
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/charts/taisce@${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # ── Verify what was published, the way a consumer would ──────────────────────────────────
      #
      # SECURITY.md tells people how to check a release without taking this project's word for it.
      # These are those commands, run here against what this run just pushed, before the release
      # page announces it — so the documented check is exercised on every release rather than
      # described, and a release whose artifacts do not verify is never announced (D6).
      #
      # Each check is pinned as tightly as the artifact allows: the attestation to this repository,
      # this workflow file and this tag; the signature to this workflow's exact identity at this tag.
      # A looser check — any repository in the organisation, any workflow, any ref — would accept an
      # artifact this release did not produce.
      - name: Verify the published artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          SUBSTRATE_DIGEST: ${{ steps.substrate.outputs.digest }}
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
        run: |
          set -euo pipefail
          workflow="${GITHUB_REPOSITORY}/.github/workflows/release.yml"
          identity="https://github.com/${workflow}@${GITHUB_REF}"
          issuer=https://token.actions.githubusercontent.com
          for bin in dist/taisce-"${TAG}"-*-*; do
            gh attestation verify "$bin" --repo "$GITHUB_REPOSITORY" --signer-workflow "$workflow" --source-ref "$GITHUB_REF"
          done
          for ref in "${IMAGE}@${IMAGE_DIGEST}" "${SUBSTRATE}@${SUBSTRATE_DIGEST}"; do
            gh attestation verify "oci://${ref}" --repo "$GITHUB_REPOSITORY" --signer-workflow "$workflow" --source-ref "$GITHUB_REF"
            cosign verify "$ref" --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" > /dev/null
          done
          cosign verify "ghcr.io/${{ github.repository_owner }}/charts/taisce@${CHART_DIGEST}" \
            --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" > /dev/null

      - name: Release page
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/taisce-*
          generate_release_notes: true
