#
# A release is a tag on the public repository, and this workflow is the only thing that makes one
#. It runs the complete gate the build runs on every push, then builds the image, the chart
# and the binaries, signs them with the workflow's own identity (Sigstore keyless: no signing key
# exists to steal) and attaches SLSA build provenance, so a package that did not come from here is
# distinguishable from one that did. Nothing here is a claim about a maintainer whose account and
# repository are both compromised; SECURITY.md says so.
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make db-up
      - run: make test COVER_PROFILE=coverage.out
      - run: go vet ./...
      - if: always()
        run: make db-down

  publish:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/taisce
      CHART: oci://ghcr.io/${{ github.repository_owner }}/charts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: sigstore/cosign-installer@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The version the binary reports is the tag, and nothing else about the build varies with the
      # machine: -trimpath drops paths, -buildvcs=false drops the checkout's own stamp, so the same
      # tag builds the same bytes anywhere the same toolchain runs.
      - name: Binaries
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -buildvcs=false \
              -ldflags="-s -w -X main.version=${tag}" -o "dist/taisce-${tag}-${os}-${arch}" ./cmd/taisce
          done
          (cd dist && sha256sum * > "taisce-${tag}-checksums.txt")
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - name: Image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: true
          sbom: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:${{ github.sha }}
      - name: Sign the image
        run: cosign sign --yes "${IMAGE}@${{ steps.image.outputs.digest }}"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Chart
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          helm package deploy/helm/taisce --version "$tag" --app-version "$tag" -d dist
          helm registry login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          helm push "dist/taisce-${tag}.tgz" "$CHART" 2>&1 | tee dist/chart-push.log
          digest="$(grep -o 'sha256:[0-9a-f]*' dist/chart-push.log | head -1)"
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/charts/taisce@${digest}"

      - name: Release page
        uses: softprops/action-gh-release@v2
        with:
          files: dist/taisce-*
          generate_release_notes: true
