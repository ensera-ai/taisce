#
# The build is the gate a change has to pass, and it is the same target a contributor runs: the
# complete uncached suite against the project's own PostgreSQL image, cross-package coverage measured
# against the floor, `go vet`, and the licence gate. `make gate` runs exactly this in a container, so
# a local green and a build green mean the same thing rather than two different things.
#
# There is no skip-when-absent arm anywhere below. A missing database fails the run rather than
# passing it empty, because a suite that skips its own dependency is a green run that asserted
# nothing — which is worse than a red one, since nobody looks at it.
#
# The live-inference target is deliberately not here. It costs money and sends text to a provider, so
# it stays a command somebody types on purpose (`make test-inference`).
name: test

# ── WHEN IT RUNS ─────────────────────────────────────────────────────────────────────────────────
#
# On every pull request, because a change nothing has checked is a change nobody can review — a
# description of what its author ran is a claim, and this project does not accept claims as evidence.
#
# And on every push to main, which is not the same run repeated. History here is linear and merges
# squash, so the commit that lands on main is a tree that has never existed before: the change as
# reviewed, replayed on whatever main had become in the meantime. That tree is what people clone, and
# it is the one nothing else would ever test.
#
# This workflow needs no secrets, so it runs unchanged on a pull request from a fork, which is where
# most contributions arrive from.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded pull-request run is cancelled: pushing again to a branch means the earlier result is
# about to be answered by a newer one, and finishing it proves something about a commit nobody will
# merge. Main is never cancelled, because a cancelled run there leaves the branch everybody clones
# with no result at all.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # The substrate is the project's own image, built from deploy/postgres, so the extensions and
      # settings the tests need are the ones a deployment has. `make db-up` waits until it answers.
      - name: Start the substrate
        run: make db-up

      # `make test` is licence gate, then the suite with -coverpkg=./..., then the coverage gate.
      - name: Test, coverage gate, licence gate
        run: make test COVER_PROFILE=coverage.out

      - name: Vet
        run: go vet ./...

      - name: Stop the substrate
        if: always()
        run: make db-down
