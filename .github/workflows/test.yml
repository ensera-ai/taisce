#
# The build is the gate a change has to pass, and it is the same target a contributor runs: the
# complete uncached suite against the project's own PostgreSQL image, cross-package coverage measured
# against the floor, `go vet`, and the licence gate. `make gate` runs exactly this in a container, so
# a local green and a build green mean the same thing rather than two different things.
#
# There is no skip-when-absent arm anywhere below. A missing database fails the run rather than
# passing it empty, because a suite that skips its own dependency is a green run that asserted
# nothing — which is worse than a red one, since nobody looks at it.
#
# The live-inference target is deliberately not here. It costs money and sends text to a provider, so
# it stays a command somebody types on purpose (`make test-inference`).
name: test

# ── WHEN IT RUNS ─────────────────────────────────────────────────────────────────────────────────
#
# On every pull request, because a change nothing has checked is a change nobody can review — a
# description of what its author ran is a claim, and this project does not accept claims as evidence.
#
# And on every push to main, which is not the same run repeated. History here is linear and merges
# squash, so the commit that lands on main is a tree that has never existed before: the change as
# reviewed, replayed on whatever main had become in the meantime. That tree is what people clone, and
# it is the one nothing else would ever test.
#
# This workflow needs no secrets, so it runs unchanged on a pull request from a fork, which is where
# most contributions arrive from.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded pull-request run is cancelled: pushing again to a branch means the earlier result is
# about to be answered by a newer one, and finishing it proves something about a commit nobody will
# merge. Main is never cancelled, because a cancelled run there leaves the branch everybody clones
# with no result at all.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The whole history, with its tags. `make test` ends by running the previous release on this
      # tree's migrations, and finds that release by its tag; a checkout one commit deep has none,
      # and the check refuses to pass for want of something to compare against (D58).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # The chart tests render the chart, and which helm renders it decides what they are testing:
      # the majors differ in what they will render at all, so a client-side dry run needs no cluster
      # on one and contacts a cluster on the other. The runner image ships a helm of its own, and
      # taking it would render the chart here with a different engine than `make gate` uses — making
      # this file's promise above untrue for every chart test, in the quiet direction as well as the
      # loud one: a rendering both accept for different reasons is one nobody has checked.
      #
      # So the version is the one deploy/gate/Dockerfile pins, and moving major stays the deliberate
      # act that file describes. The two pins are held together by a test, because they live in
      # different files and are edited months apart by somebody changing something else.
      #
      # Pinned and verified rather than installed by a script fetched at run time: a pipe into a
      # shell is a build that runs whatever a host served that morning.
      - name: Helm
        env:
          HELM_VERSION: v4.3.0
          HELM_SHA256: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  /tmp/helm.tgz" | sha256sum -c -
          tar -xzf /tmp/helm.tgz -C /tmp linux-amd64/helm
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version --short

      # The substrate is the project's own image, built from deploy/postgres, so the extensions and
      # settings the tests need are the ones a deployment has. `make db-up` waits until it answers.
      - name: Start the substrate
        run: make db-up

      # `make test` is licence gate, then the suite with -coverpkg=./..., then the coverage gate.
      - name: Test, coverage gate, licence gate
        run: make test COVER_PROFILE=coverage.out

      - name: Vet
        run: go vet ./...

      # Reachability, not presence: an advisory in code nothing here calls is reported and does not
      # fail. The scanner is pinned in go.mod, so this commit is judged by a version this commit names.
      - name: Reachable advisories
        run: make vuln

      - name: Stop the substrate
        if: always()
        run: make db-down
