# Build the working tree instead of pulling a release.
#
# `compose.yaml` names published images and nothing else, so `docker compose up` runs what a release
# produced. That is right for everybody evaluating Taisce and wrong for everybody changing it, which
# is what this overlay is for:
#
#     docker compose -f compose.yaml -f compose.build.yaml up -d --build
#
# ── WHY THIS IS A SEPARATE FILE ──────────────────────────────────────────────────────────────────
#
# Compose accepts `image:` and `build:` on one service and builds when the image is not in the local
# cache. That makes "did I test my change or a published release?" a question about cache state
# rather than about what was asked for — and the wrong answer is the silent one. Here, a build is
# something you named on the command line.
#
# ── WHY THE BUILD HAS ITS OWN TAG ────────────────────────────────────────────────────────────────
#
# The local image cache is one namespace for every Compose install on the machine. A build written to
# the release tag the base file names would replace that release for all of them: the next install
# recreated in any other directory would run this working tree while `docker compose ps`, `docker
# image ls` and the container's image name all said release. So every service is tagged `taisce:dev`
# or `taisce-postgres:dev`, names with no registry host, which no release pushes and no registry
# serves, and `pull_policy: build` makes Compose build them rather than look them up. Leaving this
# overlay off runs the release again, because the base file still names it.
#
# Not a project-scoped name, which is Compose's default: it changes with the directory, so one build
# has a different name in every checkout. The cost of a fixed tag is that two checkouts on one machine
# share it and the last one built is what both run; both are working-tree builds, which is the
# distinction the tag exists to keep.

services:
  postgres:
    image: taisce-postgres:dev
    pull_policy: build
    build: ./deploy/postgres

  bootstrap:
    image: taisce:dev
    pull_policy: build
    build: &service-build
      context: .
      args:
        # The binary reports what it was built from. A local build says so rather than claiming a
        # release tag it is not.
        VERSION: ${TAISCE_VERSION:-dev}

  api:
    image: taisce:dev
    pull_policy: build
    build: *service-build

  worker:
    image: taisce:dev
    pull_policy: build
    build: *service-build

  manage:
    image: taisce:dev
    pull_policy: build
    build: *service-build
